<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Singa Toolbox | ORT Singalovsky</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f6fb; --surface:#fff; --ink:#14263f; --muted:#5a6b84; --line:#d8e2ef;
  --accent:#1d4e89; --accent2:#29a9e0; --accent-ink:#fff; --soft:#e3effa; --soon:#eef2f7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1624; --surface:#14233a; --ink:#e8f0fa; --muted:#9db0c8; --line:#263a57;
    --accent:#4aa3e8; --accent2:#29a9e0; --accent-ink:#06182b; --soft:#1b3050; --soon:#1b2c45;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1624; --surface:#14233a; --ink:#e8f0fa; --muted:#9db0c8; --line:#263a57;
  --accent:#4aa3e8; --accent2:#29a9e0; --accent-ink:#06182b; --soft:#1b3050; --soon:#1b2c45;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5;min-height:100vh}
main{max-width:900px;margin:0 auto;padding:28px 20px 56px}

/* כותרת עם לוגו */
.brand{display:flex;align-items:center;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.logo{background:#fff;border-radius:16px;padding:8px 14px;border:1.5px solid var(--line);flex:none}
.logo img{display:block;height:64px;width:auto;max-width:100%}
.brand h1{margin:0;font-size:1.7rem;font-weight:800;line-height:1.2}
.brand p{margin:2px 0 0;color:var(--muted)}

/* קרוסלה */
.carousel{position:relative;margin-bottom:34px}
.viewport{overflow:hidden;border-radius:22px;touch-action:pan-y}
.track{display:flex;transition:transform .45s ease;will-change:transform}
.slide{
  flex:none;width:100%;min-height:230px;padding:30px 28px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;
  color:#fff;background:linear-gradient(135deg,#1d4e89,#29a9e0);
}
.slide:nth-child(3n+2){background:linear-gradient(135deg,#17365f,#1d6fb8)}
.slide:nth-child(3n){background:linear-gradient(135deg,#1d4e89,#12315a)}
.s-icon{font-size:2.4rem;line-height:1}
.s-cat{font-size:.85rem;font-weight:500;opacity:.85}
.s-title{font-size:1.8rem;font-weight:800;margin:0;line-height:1.2}
.s-desc{margin:0;font-size:1.05rem;max-width:34em;margin-inline:auto;opacity:.95}
.s-btn{
  align-self:center;margin-top:6px;font:inherit;font-weight:700;cursor:pointer;
  padding:11px 22px;border-radius:999px;border:0;background:#fff;color:#1d4e89;text-decoration:none;
}
.s-btn:focus-visible,.nav:focus-visible,.dot:focus-visible{outline:3px solid #fff;outline-offset:3px}
.nav{
  position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;
  border:0;background:rgba(255,255,255,.92);color:#1d4e89;font-size:1.5rem;cursor:pointer;
  display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.nav.next{left:12px}
.nav.prev{right:12px}
.dots{display:flex;justify-content:center;gap:8px;margin-top:12px}
.dot{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer}
.dot[aria-current="true"]{background:var(--accent);width:26px;border-radius:999px}
.dot:focus-visible{outline-color:var(--accent)}
.carousel .viewport:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* חיפוש, קטגוריות וכרטיסים */
h2{font-size:1.3rem;margin:0 0 14px}
.search{width:100%;padding:14px 16px;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px}
.search:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 20px}
.chip{font:inherit;font-weight:500;padding:8px 16px;border-radius:999px;cursor:pointer;background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin:0;padding:0;list-style:none}
.card{
  display:flex;flex-direction:column;gap:10px;height:100%;min-height:150px;padding:18px;width:100%;
  text-align:right;font:inherit;color:var(--ink);text-decoration:none;cursor:pointer;
  background:var(--surface);border:1.5px solid var(--line);border-radius:18px;transition:border-color .15s,transform .1s;
}
.card:hover{border-color:var(--accent2)}
.card:active{transform:scale(.985)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between}
.icon{width:46px;height:46px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:1.5rem}
.badge{font-size:.78rem;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--soon);color:var(--muted)}
.name{font-weight:700;font-size:1.12rem}
.desc{color:var(--muted);font-size:.94rem;flex:1}
.open{color:var(--accent);font-weight:700;font-size:.95rem}
.empty{display:none;text-align:center;color:var(--muted);padding:40px 0}
.toast{position:fixed;inset-inline:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:420px;margin-inline:auto;padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--bg);text-align:center;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (max-width:520px){
  .brand h1{font-size:1.4rem}.logo img{height:52px}
  .slide{padding:24px 20px 26px;min-height:250px}.s-title{font-size:1.5rem}
  .nav{width:38px;height:38px}
}
@media (prefers-reduced-motion:reduce){.track,.card,.toast{transition:none}}
</style>
</head>

  <p class="empty" id="empty">לא נמצא כלי שמתאים לחיפוש. נסו מילה אחרת או בחרו "הכול".</p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ כאן מתאימים את הדף ============
   title: שם הכלי | desc: הסבר קצר | icon: אימוג'י | cat: קטגוריה
   url: הכתובת אליה עוברים. כל עוד היא ריקה, הכלי מסומן "בקרוב".
   featured: false כדי להסתיר כלי מהקרוסלה (ברירת מחדל: מופיע בה).
   newTab: false לפתיחה באותה לשונית (ברירת מחדל: לשונית חדשה). */
const TOOLS = [
  { title:"איתור מייל מורה", desc:"מצאו כתובת מייל של מורה במהירות.", icon:"🔎", cat:"מייל", url:"https://claude.ai/artifact/DzCt4A6WqD87Wy81XGqrBR" },
  { title:"מחולל חתימות למייל", desc:"חתימה מעוצבת בסגנון אורט סינגאלובסקי, עם העתקה ל-Gmail או Outlook.", icon:"✍️", cat:"מייל", url:"https://nicknamecreateort.onrender.com/" },
  { title:"מחולל הערכות מילוליות", desc:"הקלידו שם ותכונות, וההערכה תיכתב בלשון הנכונה אוטומטית.", icon:"📝", cat:"הערכות", url:"https://strengths-first.onrender.com/" },
  { title:"מעקב חלוקת ציוד", desc:"רושמים מה יצא מהמחסן, למי ומתי, והמלאי מתעדכן לבד.", icon:"📦", cat:"ציוד", url:"https://caretaker-8svx.onrender.com/" }
];
/* ============================================ */

const $=id=>document.getElementById(id);
const toast=$("toast"); let tt;
function showToast(m){toast.textContent=m;toast.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove("show"),2200)}
function go(t){
  if(!t.url){showToast("הכלי הזה יתחבר בקרוב");return}
  if(t.newTab===false) location.href=t.url; else window.open(t.url,"_blank","noopener");
}

/* ---------- קרוסלה ---------- */
const slides=TOOLS.filter(t=>t.featured!==false);
const track=$("track"), dots=$("dots"), viewport=$("viewport");
let idx=0, timer=null;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

slides.forEach((t,i)=>{
  const s=document.createElement("div");
  s.className="slide"; s.setAttribute("role","group");
  s.setAttribute("aria-roledescription","שקופית");
  s.setAttribute("aria-label",(i+1)+" מתוך "+slides.length);
  s.innerHTML='<span class="s-icon" aria-hidden="true"></span><span class="s-cat"></span><h2 class="s-title"></h2><p class="s-desc"></p><button class="s-btn" type="button"></button>';
  s.querySelector(".s-icon").textContent=t.icon;
  s.querySelector(".s-cat").textContent=t.cat;
  s.querySelector(".s-title").textContent=t.title;
  s.querySelector(".s-desc").textContent=t.desc;
  const b=s.querySelector(".s-btn");
  b.textContent=t.url?"פתיחת הכלי":"בקרוב";
  b.onclick=()=>go(t);
  track.appendChild(s);
  const d=document.createElement("button");
  d.type="button"; d.className="dot"; d.setAttribute("aria-label","מעבר לכלי "+(i+1));
  d.onclick=()=>{show(i);restart()};
  dots.appendChild(d);
});
function show(i){
  idx=(i+slides.length)%slides.length;
  track.style.transform="translateX("+(idx*100)+"%)";
  [...dots.children].forEach((d,k)=>d.setAttribute("aria-current",k===idx));
  [...track.children].forEach((s,k)=>{s.inert=k!==idx});
}
function restart(){
  clearInterval(timer);
  if(!reduce&&slides.length>1) timer=setInterval(()=>show(idx+1),5500);
}
$("next").onclick=()=>{show(idx+1);restart()};
$("prev").onclick=()=>{show(idx-1);restart()};
viewport.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"){show(idx+1);restart()}
  if(e.key==="ArrowRight"){show(idx-1);restart()}
});
/* החלקה במגע: החלקה ימינה = הכלי הבא (כיוון קריאה מימין לשמאל) */
let x0=null;
viewport.addEventListener("pointerdown",e=>{x0=e.clientX});
viewport.addEventListener("pointerup",e=>{
  if(x0===null)return; const dx=e.clientX-x0; x0=null;
  if(Math.abs(dx)>50){show(dx>0?idx+1:idx-1);restart()}
});
viewport.addEventListener("pointercancel",()=>{x0=null});
const car=document.querySelector(".carousel");
car.addEventListener("mouseenter",()=>clearInterval(timer));
car.addEventListener("mouseleave",restart);
car.addEventListener("focusin",()=>clearInterval(timer));
car.addEventListener("focusout",restart);
if(slides.length<2){$("prev").hidden=true;$("next").hidden=true;dots.hidden=true}
show(0);restart();

/* ---------- רשימת כל הכלים ---------- */
const grid=$("grid"),chips=$("chips"),q=$("q"),empty=$("empty");
let active="הכול";
function renderChips(){
  const cats=["הכול",...new Set(TOOLS.map(t=>t.cat))];
  chips.innerHTML="";
  cats.forEach(c=>{
    const b=document.createElement("button");
    b.type="button";b.className="chip";b.textContent=c;
    b.setAttribute("aria-pressed",c===active);
    b.onclick=()=>{active=c;renderChips();renderCards()};
    chips.appendChild(b);
  });
}
function renderCards(){
  const term=q.value.trim().toLowerCase();
  grid.innerHTML="";let count=0;
  TOOLS.forEach(t=>{
    if(active!=="הכול"&&t.cat!==active)return;
    if(term&&!(t.title+" "+t.desc+" "+t.cat).toLowerCase().includes(term))return;
    count++;
    const li=document.createElement("li");
    const el=document.createElement(t.url?"a":"button");
    el.className="card";
    if(t.url){el.href=t.url;if(t.newTab!==false){el.target="_blank";el.rel="noopener noreferrer"}}
    else{el.type="button";el.onclick=()=>showToast("הכלי הזה יתחבר בקרוב")}
    el.innerHTML='<span class="top"><span class="icon" aria-hidden="true"></span><span class="badge"></span></span><span class="name"></span><span class="desc"></span><span class="open"></span>';
    el.querySelector(".icon").textContent=t.icon;
    el.querySelector(".badge").textContent=t.url?t.cat:"בקרוב";
    el.querySelector(".name").textContent=t.title;
    el.querySelector(".desc").textContent=t.desc;
    el.querySelector(".open").textContent=t.url?"פתיחת הכלי ‹":"";
    li.appendChild(el);grid.appendChild(li);
  });
  empty.style.display=count?"none":"block";
}
q.addEventListener("input",renderCards);
renderChips();renderCards();
</script>
</body>
</html>
